[project]
name = "verity-title-backend"
version = "0.1.0"
description = "AI-assisted Current Owner Search and Title Search backend"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30.0",
  "beautifulsoup4>=4.12.0",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "lxml>=5.0.0",
  "pydantic-settings>=2.7.0",
  "PyJWT>=2.10.0",
  "requests>=2.31.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
